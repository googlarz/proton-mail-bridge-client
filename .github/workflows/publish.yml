name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing exchanges this job's OIDC token for a short-lived
      # publish token — no NPM_TOKEN secret, so classic-token 2FA/EOTP
      # prompts (which blocked every publish since v1.13.8) can't happen.
      # Requires npm CLI >=11.5.1; setup-node's bundled npm may be older.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish

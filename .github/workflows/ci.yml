name: CI

on:
  push:
  pull_request:

# The test matrix only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [24]
        include:
          # ubuntu-latest moves from Ubuntu 24.04 to 26.04 between 2026-10-19 and 2026-11-19 (actions/runner-images
          # issue 14748); test the new image now instead of finding out when the label moves.
          - os: ubuntu-26.04
            node-version: 24
          # package.json says node >=24, so newer lines have to keep working; Node 26 passes the whole suite.
          - os: ubuntu-latest
            node-version: 26
          # The darwin .mcpb bundle ships to users, so test on macOS too.
          - os: macos-latest
            node-version: 24
          # ...and the win32 bundle: Windows refuses to delete open files, which
          # is how the missing LocalIndexService.close() was found.
          - os: windows-latest
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint types
        run: npm run lint

      - name: Run test suite
        run: npm test

      # Packs the project, installs the tarball into an empty project (production dependencies only)
      # and starts the installed server and CLI. The test suite above runs against the repo's own
      # node_modules, so it cannot see a dependency that is missing from the published package.
      - name: Pack smoke test
        run: npm run smoke:pack

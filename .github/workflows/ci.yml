name: CI

on:
  push:
  pull_request:

# The test matrix only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [24]
        include:
          # The darwin .mcpb bundle ships to users, so test on macOS too.
          - os: macos-latest
            node-version: 24
          # ...and the win32 bundle: Windows refuses to delete open files, which
          # is how the missing LocalIndexService.close() was found.
          - os: windows-latest
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint types
        run: npm run lint

      - name: Run test suite
        run: npm test

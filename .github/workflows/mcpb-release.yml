name: Build .mcpb bundles

# Runs when a release is PUBLISHED (releases here are created by hand after the
# tag is pushed), so the bundles can always be attached — a tag-push trigger
# finished before the release existed and needed manual reruns.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner builds every target whose native prebuild better-sqlite3 ships in the
          # package (checked by test/mcpb-build.test.mjs); no extra runner types needed.
          - os: macos-latest
            targets: darwin-arm64,darwin-x64
          - os: ubuntu-latest
            targets: linux-x64,linux-arm64
          - os: windows-latest
            targets: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Release tag must match package version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"

      - run: npm run package:mcpb -- --targets ${{ matrix.targets }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb-${{ matrix.os }}
          path: '*.mcpb'
          if-no-files-found: error

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcpb-*
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" ./*.mcpb --clobber

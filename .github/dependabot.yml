version: 2
updates:
  # Workflow actions are pinned to commit SHAs (see .github/workflows); Dependabot
  # keeps those pins current and updates the "# vX.Y.Z" comment next to each one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # This package declares support for Node >=20. better-sqlite3 13 requires Node >=22
      # and crashes (SIGSEGV) when the index is opened on Node 20, so stay on the 12.x
      # line (minor and patch updates still arrive). Revisit together with raising
      # `engines.node` and the CI matrix; the allowScripts pin in package.json must
      # then be updated as well.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      # Type definitions should describe the OLDEST Node this package supports, not the
      # newest: @types/node 26 lets code call APIs Node 20 does not have and still
      # compile, so the failure would only show up at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

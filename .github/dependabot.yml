version: 2
updates:
  # Workflow actions are pinned to commit SHAs (see .github/workflows); Dependabot
  # keeps those pins current and updates the "# vX.Y.Z" comment next to each one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      # imapflow and unpdf are pinned to exact versions (package.json): unpdf parses untrusted PDFs and imapflow
      # is the IMAP core, so a bump of either is reviewed on its own, not buried in a group of four.
      pinned-dependencies:
        patterns: ["imapflow", "unpdf"]
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
        exclude-patterns: ["imapflow", "unpdf"]
    ignore:
      # Type definitions should describe the OLDEST Node this package supports, not the
      # newest: a newer @types/node lets code call APIs the minimum Node does not have and
      # still compile, so the failure would only show up at runtime. Raise it together
      # with `engines.node`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
